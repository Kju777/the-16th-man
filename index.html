<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The 16th Man</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 h-screen font-sans overflow-hidden">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('coaches');
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            
            const saveApiKey = (key) => {
                setApiKey(key);
                localStorage.setItem('gemini_api_key', key);
            };

            return (
                <div class="flex flex-col h-full max-w-md mx-auto bg-white shadow-xl relative">
                    <header class="bg-slate-900 text-white p-4 flex justify-between items-center shadow-md z-10">
                        <div class="flex items-center gap-3">
                            <div class="bg-emerald-500 text-slate-900 font-black text-xl w-10 h-10 flex items-center justify-center rounded-full">16</div>
                            <h1 class="text-xl font-bold tracking-wider">The 16th Man</h1>
                        </div>
                    </header>

                    <main class="flex-1 overflow-y-auto no-scrollbar pb-20 bg-gray-50">
                        {activeTab === 'coaches' && <CoachesTab apiKey={apiKey} />}
                        {activeTab === 'schedule' && <ScheduleTab />}
                        {activeTab === 'nutrition' && <NutritionTab />}
                        {activeTab === 'health' && <HealthTab />}
                        {activeTab === 'settings' && <SettingsTab apiKey={apiKey} saveApiKey={saveApiKey} />}
                    </main>

                    <nav class="bg-white border-t border-gray-200 absolute bottom-0 w-full flex justify-around p-2 pb-4 text-xs z-10">
                        <NavButton icon="fa-solid fa-user-tie" label="Coaches" active={activeTab === 'coaches'} onClick={() => setActiveTab('coaches')} />
                        <NavButton icon="fa-solid fa-calendar-days" label="Schedule" active={activeTab === 'schedule'} onClick={() => setActiveTab('schedule')} />
                        <NavButton icon="fa-solid fa-utensils" label="Nutrition" active={activeTab === 'nutrition'} onClick={() => setActiveTab('nutrition')} />
                        <NavButton icon="fa-solid fa-heart-pulse" label="Health" active={activeTab === 'health'} onClick={() => setActiveTab('health')} />
                        <NavButton icon="fa-solid fa-gear" label="Settings" active={activeTab === 'settings'} onClick={() => setActiveTab('settings')} />
                    </nav>
                </div>
            );
        }

        function NavButton({ icon, label, active, onClick }) {
            return (
                <button onClick={onClick} class={`flex flex-col items-center p-2 w-16 transition-colors ${active ? 'text-emerald-600' : 'text-gray-400 hover:text-gray-600'}`}>
                    <i class={`${icon} text-xl mb-1`}></i>
                    <span>{label}</span>
                </button>
            );
        }

        function SettingsTab({ apiKey, saveApiKey }) {
            const [inputKey, setInputKey] = useState(apiKey);
            const [saved, setSaved] = useState(false);

            const handleSave = () => {
                saveApiKey(inputKey);
                setSaved(true);
                setTimeout(() => setSaved(false), 2000);
            };

            return (
                <div class="p-6">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800">Settings</h2>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                        <h3 class="font-bold text-gray-700 mb-2">Gemini API Key</h3>
                        <p class="text-sm text-gray-500 mb-4">
                            輸入您的 API 金鑰以啟用 AI 教練。金鑰將安全地儲存在這台設備的瀏覽器中，不會上傳至伺服器。
                        </p>
                        <input 
                            type="password" 
                            value={inputKey}
                            onChange={(e) => setInputKey(e.target.value)}
                            placeholder="請貼上您的 API Key..." 
                            class="w-full border border-gray-300 rounded-lg p-3 mb-4 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none"
                        />
                        <button 
                            onClick={handleSave}
                            class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg hover:bg-emerald-700 transition-colors"
                        >
                            {saved ? 'Saved!' : 'Save Key'}
                        </button>
                    </div>
                </div>
            );
        }

        function CoachesTab({ apiKey }) {
            const [messages, setMessages] = useState([{role: 'model', text: '你好！準備好今天的訓練了嗎？想問關於戰術、體能還是營養的問題？'}]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(scrollToBottom, [messages]);

            const sendMessage = async () => {
                if (!input.trim()) return;
                if (!apiKey) {
                    alert("請先至 Settings 分頁設定 Gemini API Key！");
                    return;
                }

                const userMsg = { role: 'user', text: input };
                setMessages(prev => [...prev, userMsg]);
                setInput('');
                setIsLoading(true);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`, {, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            system_instruction: {
                                parts: [{ text: "你是一個專業的橄欖球AI教練。使用者是一位橄欖球員。請提供簡潔、專業、針對運動員強度的戰術、體能或營養建議。" }]
                            },
                            contents: [{ parts: [{ text: input }] }]
                        })
                    });
                    
                    const data = await response.json();
                    if(data.error) throw new Error(data.error.message);
                    
                    const aiMsg = { role: 'model', text: data.candidates[0].content.parts[0].text };
                    setMessages(prev => [...prev, aiMsg]);
                } catch (error) {
                    setMessages(prev => [...prev, { role: 'model', text: `發生錯誤: ${error.message} (請檢查 API Key 是否正確)` }]);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div class="flex flex-col h-full">
                    <div class="p-4 bg-white border-b flex gap-2 overflow-x-auto no-scrollbar">
                        <span class="bg-slate-800 text-white px-4 py-1 rounded-full text-sm whitespace-nowrap font-medium">Head Coach</span>
                        <span class="bg-gray-100 text-gray-500 px-4 py-1 rounded-full text-sm whitespace-nowrap">S&C Coach</span>
                        <span class="bg-gray-100 text-gray-500 px-4 py-1 rounded-full text-sm whitespace-nowrap">Nutritionist</span>
                    </div>
                    
                    <div class="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.map((msg, idx) => (
                            <div key={idx} class={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div class={`max-w-[80%] p-3 rounded-2xl ${msg.role === 'user' ? 'bg-emerald-600 text-white rounded-br-none' : 'bg-white border text-gray-800 rounded-bl-none shadow-sm'}`}>
                                    <p class="whitespace-pre-wrap text-sm leading-relaxed">{msg.text}</p>
                                </div>
                            </div>
                        ))}
                        {isLoading && (
                            <div class="flex justify-start">
                                <div class="bg-white border p-3 rounded-2xl rounded-bl-none text-gray-400 text-sm shadow-sm">
                                    教練正在思考中...
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div class="p-4 bg-white border-t">
                        <div class="flex gap-2">
                            <input 
                                type="text" 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                                placeholder="詢問教練..." 
                                class="flex-1 border rounded-full px-4 py-2 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm"
                            />
                            <button onClick={sendMessage} class="bg-emerald-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:bg-emerald-700 transition">
                                <i class="fa-solid fa-paper-plane text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function ScheduleTab() {
            const schedule = [
                { day: 'Mon', type: 'Team Training', desc: 'Field Session', active: true },
                { day: 'Tue', type: 'Gym', desc: 'Strength & Conditioning', active: true },
                { day: 'Wed', type: 'Rest', desc: 'Active Recovery', active: false },
                { day: 'Thu', type: 'Team Training', desc: 'Field Session', active: true },
                { day: 'Fri', type: 'Captain\'s Run', desc: 'Team Run-through', active: false },
                { day: 'Sat', type: 'Match Day', desc: 'Game Day', active: true },
                { day: 'Sun', type: 'Rest', desc: 'Recovery', active: false },
            ];

            return (
                <div class="p-6">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800">Weekly Schedule</h2>
                    <div class="space-y-3">
                        {schedule.map(s => (
                            <div key={s.day} class={`p-4 rounded-xl flex items-center gap-4 ${s.active ? 'bg-white border-l-4 border-emerald-500 shadow-sm' : 'bg-gray-100 opacity-60'}`}>
                                <div class="w-10 font-bold text-gray-400">{s.day}</div>
                                <div>
                                    <div class={`font-bold ${s.active ? 'text-gray-800' : 'text-gray-500'}`}>{s.type}</div>
                                    <div class="text-xs text-gray-500 mt-1">{s.desc}</div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function NutritionTab() {
            return (
                <div class="p-6">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800">Nutrition</h2>
                    
                    <div class="bg-slate-900 text-white rounded-2xl p-6 mb-6 shadow-lg">
                        <div class="flex justify-between items-end mb-2">
                            <div>
                                <p class="text-slate-400 text-sm font-medium">Calories Today</p>
                                <h3 class="text-4xl font-black mt-1">0 <span class="text-lg font-medium text-slate-400">/ 3,000</span></h3>
                            </div>
                        </div>
                        <div class="w-full bg-slate-700 rounded-full h-2.5 mt-4">
                            <div class="bg-emerald-400 h-2.5 rounded-full" style={{width: '0%'}}></div>
                        </div>
                    </div>

                    <h3 class="font-bold text-gray-800 mb-3">Log Meal</h3>
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
                        <input type="text" placeholder="e.g., Chicken Breast & Rice, Protein Shake..." class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:outline-none focus:border-emerald-500 text-sm" />
                        <div class="flex gap-2">
                            <input type="number" placeholder="Calories" class="flex-1 border border-gray-200 rounded-lg p-3 bg-gray-50 focus:outline-none focus:border-emerald-500 text-sm" />
                            <button class="bg-emerald-600 text-white font-bold px-6 rounded-lg hover:bg-emerald-700 transition">Add</button>
                        </div>
                    </div>
                </div>
            );
        }

        function HealthTab() {
            return (
                <div class="p-6">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800">Health Sync</h2>
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 text-center">
                        <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fa-solid fa-heart text-2xl"></i>
                        </div>
                        <h3 class="font-bold text-gray-800 text-lg mb-2">Apple Health / Google Fit</h3>
                        <p class="text-sm text-gray-500 mb-6 px-4">Connect your health data to automatically sync steps, active calories, and heart rate for the coaches to analyze.</p>
                        <button class="w-full border-2 border-slate-900 text-slate-900 font-bold py-3 rounded-lg hover:bg-slate-900 hover:text-white transition-colors">
                            Connect Device
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mt-6">
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-xs text-gray-400 font-bold mb-1">STEPS</p>
                            <p class="text-2xl font-black text-gray-800">0</p>
                        </div>
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <p class="text-xs text-gray-400 font-bold mb-1">BURNED</p>
                            <p class="text-2xl font-black text-gray-800">0 <span class="text-sm font-normal text-gray-500">kcal</span></p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
